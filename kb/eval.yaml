# Оценочный набор для поиска по базе знаний.
#
# Написан ДО настройки ретривера и правится только вместе с содержимым базы,
# а не вместе с поиском. Набор, подогнанный под уже готовый поиск, меряет сам
# себя: он всегда покажет хорошие числа и ни разу не скажет, что стало хуже.
#
# Вопросы — родительские, теми словами, какими их задают в три часа ночи, а не
# теми, какими написан документ. В этом весь смысл: если бы формулировки
# совпадали, хватило бы поиска подстроки.
#
# Поля вопроса:
#   q        — вопрос
#   source   — id источника, в котором лежит ответ
#   contains — фрагмент считается верным, если в нём находится любое из этих
#              выражений. Это регулярные выражения, и ищутся они по
#              нормализованному тексту (нижний регистр, ё → е), поэтому в них
#              пишутся основы, а не словоформы
#
# Раздел `silence` — вопросы, на которые бот обязан ПРОМОЛЧАТЬ. Это половина
# качества: ретривер, отвечающий на «сколько стоит биткоин» абзацем из
# клинических рекомендаций, опаснее молчащего, потому что выглядит знающим.

questions:
  # --- Здоровый новорождённый ---------------------------------------------
  - q: когда новорождённого первый раз прикладывают к груди
    source: kr_newborn_2025
    contains: ['перв\w* час', 'выложить на живот', 'приклад']
  - q: зачем новорождённого кладут маме на живот сразу после родов
    source: kr_newborn_2025
    contains: ["кожа к коже", "на живот", "контакт"]
  - q: что такое неонатальный скрининг
    source: kr_newborn_2025
    contains: ['неонатальн\w+ скрининг', 'наследственн']
  - q: зачем новорождённому проверяют слух
    source: kr_newborn_2025
    contains: ["аудиологическ", "отоакустическ", "слух"]
  - q: зачем новорождённому колют витамин K
    source: kr_newborn_2025
    contains: ["витамин", "геморрагическ"]
  - q: как оценивают ребёнка по шкале Апгар
    source: kr_newborn_2025
    contains: ["апгар"]
  - q: как ухаживать за пуповинным остатком
    source: kr_newborn_2025
    contains: ["пуповинн"]
  - q: зачем новорождённому смотрят сердце перед выпиской
    source: kr_newborn_2025
    contains: ["порок", "пульсоксиметр", "сатурац"]

  # --- Неонатальная желтуха ------------------------------------------------
  - q: почему у новорождённого желтеет кожа
    source: kr_jaundice_2025
    contains: ["билирубин"]
  - q: когда желтуха новорождённого считается физиологической
    source: kr_jaundice_2025
    contains: ["физиологическ"]
  - q: что такое фототерапия и когда её назначают
    source: kr_jaundice_2025
    contains: ["фототерап"]
  - q: как измеряют билирубин не беря кровь
    source: kr_jaundice_2025
    contains: ["транскутан", "чрескожн", "билитест"]
  - q: чем опасна желтуха для мозга ребёнка
    source: kr_jaundice_2025
    contains: ["энцефалопат", "ядерн"]
  - q: бывает ли желтуха от грудного молока
    source: kr_jaundice_2025
    contains: ['грудн\w+ молок', 'вскармливан']

  # --- Профилактические осмотры (211н) -------------------------------------
  - q: в каком возрасте ребёнка смотрит невролог
    source: order_211n
    contains: ["невролог"]
  - q: когда первый профилактический осмотр после рождения
    source: order_211n
    contains: ["1 месяц", "новорожден", "возраст"]
  - q: нужно ли моё согласие на профилактический осмотр ребёнка
    source: order_211n
    contains: ["информированн", "согласи"]
  - q: каких врачей проходят в год
    source: order_211n
    contains: ["12 месяцев", "год"]
  - q: что входит в профилактический осмотр ребёнка
    source: order_211n
    contains: ["осмотр", "исследован"]

  # --- Национальный календарь прививок (1122н) -----------------------------
  - q: когда делают первую прививку от гепатита B
    source: order_1122n
    contains: ["гепатит"]
  - q: когда ребёнку ставят БЦЖ
    source: order_1122n
    contains: ["туберкулез", "бцж"]
  - q: можно ли поставить две прививки в один день
    source: order_1122n
    contains: ["разных шприц", "один день", "одновременн"]
  - q: через сколько делают вторую прививку от гепатита B
    source: order_1122n
    contains: ["0-1-6", "через месяц", "гепатит"]

  # --- Вскармливание -------------------------------------------------------
  - q: во сколько месяцев вводить прикорм
    source: feeding_2019
    contains: ["прикорм"]
  - q: надо ли допаивать водой на грудном вскармливании
    source: feeding_2019
    contains: ["допаива", "вод"]
  - q: с какого продукта начинать прикорм
    source: feeding_2019
    contains: ['овощн\w+ пюре', 'каш', 'прикорм']
  - q: можно ли давать коровье молоко ребёнку до года
    source: feeding_2019
    contains: ["коровь"]
  - q: как часто прикладывать ребёнка к груди
    source: feeding_2019
    contains: ['по требован', 'свободн\w+ вскармливан', 'кормлен']
  - q: как понять что ребёнку хватает молока
    source: feeding_2019
    contains: ["прибавк", "мочеиспускан", "достаточн"]

  # --- Сон и активность (ВОЗ) ----------------------------------------------
  - q: сколько должен спать ребёнок в год
    source: who_sleep_2019
    contains: ["сна", "часов"]
  - q: можно ли годовалому смотреть мультики
    source: who_sleep_2019
    contains: ["экран"]
  - q: сколько времени младенцу лежать на животе
    source: who_sleep_2019
    contains: ['на животе', 'физическ\w+ активн']

  # --- Дописано после настройки порогов ----------------------------------
  #
  # Эти пятнадцать вопросов писались уже по зафиксированным порогам и в
  # тексты документов перед написанием никто не смотрел — чтобы узнать,
  # настроен поиск или подогнан. Разница вышла заметная: на вопросах, по
  # которым настраивали, recall@5 = 0.84, на этих — 0.73. Настоящая оценка
  # ближе ко вторым. Отсюда правило: следующая настройка порогов требует
  # нового отложенного набора, а не этого — он теперь тоже «свой».

  - q: обязательно ли взвешивать ребёнка каждый день в роддоме
    source: kr_newborn_2025
    contains: ['масс', 'взвешиван']
  - q: когда новорождённому делают УЗИ
    source: kr_newborn_2025
    contains: ['ультразвуков', 'узи', 'нейросонограф']
  - q: что делают с ребёнком в первые два часа после родов
    source: kr_newborn_2025
    contains: ['родильн', 'перв', 'час']
  - q: сколько держится желтуха у доношенного ребёнка
    source: kr_jaundice_2025
    contains: ['сут', 'недел', 'разреша']
  - q: нужно ли отменять грудное вскармливание при желтухе
    source: kr_jaundice_2025
    contains: ['вскармливан', 'молок']
  - q: какой уровень билирубина опасен
    source: kr_jaundice_2025
    contains: ['мкмоль', 'порог', 'уровен']
  - q: как часто ребёнка осматривает педиатр на первом году
    source: order_211n
    contains: ['педиатр', 'месяц']
  - q: кто оплачивает профилактический осмотр ребёнка
    source: order_211n
    contains: ['бесплатн', 'обязательн', 'программ']
  - q: можно ли отказаться от прививки
    source: order_1122n
    contains: ['отказ', 'согласи', 'доброволь']
  - q: в каком возрасте делают прививку от кори
    source: order_1122n
    contains: ['кор']
  - q: сколько прибавляет в весе ребёнок за первый месяц
    source: feeding_2019
    contains: ['прибавк', 'масс']
  - q: чем опасно раннее введение прикорма
    source: feeding_2019
    contains: ['прикорм', 'риск']
  - q: можно ли давать ребёнку сок
    source: feeding_2019
    contains: ['сок']
  - q: сколько времени в день младенец может быть в автокресле
    source: who_sleep_2019
    contains: ['фиксирован', 'коляск', 'автокресл', 'более 1 часа']
  - q: во сколько лет можно давать планшет
    source: who_sleep_2019
    contains: ['экран']

# Вопросы, на которые в базе ответа нет. Правильный результат — пустая выдача.
silence:
  # Вопрос настоящий и частый, а ответа в базе нет: в приказе 1122н слова
  # «противопоказание» нет ни разу — противопоказания живут в инструкциях к
  # вакцинам, отдельным документом. Вопрос стоял в разделе выше и числился
  # провалом поиска, пока не выяснилось, что искать было нечего
  - какие есть противопоказания к прививкам
  - сколько стоит биткоин
  - как поменять масло в машине
  - во сколько начинается матч
  - какой пароль от вайфая
  - подскажи рецепт борща
  - как оформить налоговый вычет
  - какая завтра погода
  - сколько весит взрослый слон
