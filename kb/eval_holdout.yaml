# Отложенный оценочный набор.
#
# Зачем он отдельно от `kb/eval.yaml`. Тот набор писался до настройки поиска,
# но потом на нём же и настраивался — 13.09, 15.09 и снова 19.09. Цена такой
# подгонки в этом проекте уже измерялась и составила одиннадцать пунктов:
# recall@5 0.84 на вопросах, по которым настраивали, против 0.73 на дописанных
# вслепую. Значит числа с основного набора всегда завышены, и знать насколько —
# можно только по набору, которого настройка не касалась.
#
# ОГОВОРКА, БЕЗ КОТОРОЙ ЭТОТ ФАЙЛ ВРЁТ. Набор написан сессией 19.09.2026 —
# той же стороной, что в тот же день правила ворота и заводила порог косинуса.
# Это лучше, чем ничего, и хуже, чем набор от владельца. Формулировки взяты из
# списка вопросов, составленного ДО того, как сессия посмотрела на устройство
# поиска и на содержимое документов; ожидаемый источник и выражения `contains`
# проставлены после — грепом по корпусу, а не прогоном ретривера.
#
# Настоящий отложенный набор должен написать владелец: своими словами, не
# заглядывая ни в документы, ни в этот файл. До тех пор числа отсюда читаются
# как «не хуже, чем», а не как «столько и есть».
#
# Формат тот же, что у `kb/eval.yaml`, и меряется тем же скриптом:
#
#     .venv\Scripts\python kb\eval_kb.py kb\eval_holdout.yaml
#
# Строки отсюда не удаляются и не переписываются ради красивого числа —
# правило то же, что в основном наборе.

questions:
  # --- Кормление и трудности груди ----------------------------------------
  - q: трещины на сосках чем мазать
    source: kr_breast_2024
    contains: ['трещин']
  - q: грудь стала твёрдая и болит что делать
    source: who_postnatal_2022
    contains: ['нагрубан']
  - q: поднялась температура и болит грудь при кормлении
    source: kr_breast_2024
    contains: ['мастит']
  - q: молоко застоялось в груди
    source: kr_postpartum_2024
    contains: ['лактостаз']
  - q: как понять что ребёнок правильно взял грудь
    source: who_bf_counselling_1993
    contains: ['приклад', 'захват', 'ареол']
  - q: можно ли давать пустышку новорождённому
    source: who_bf_counselling_1993
    contains: ['пустышк']
  - q: когда нужно докармливать смесью
    source: feeding_2019
    contains: ['докорм']
  - q: сколько ребёнок теряет в весе после рождения
    source: feeding_2019
    contains: ['потер', 'масс']

  # --- Живот и стул --------------------------------------------------------
  - q: что делать если у ребёнка колики
    source: feeding_2019
    contains: ['колик']
  - q: ребёнок срыгивает после каждого кормления
    source: feeding_2019
    contains: ['срыгиван']
  - q: ребёнок не какал два дня
    source: feeding_2019
    contains: ['запор']

  # --- Уход ----------------------------------------------------------------
  - q: когда первый раз купать новорождённого
    source: who_postnatal_2022
    contains: ['купан']
  - q: чем обрабатывать пупок
    source: kr_newborn_2025
    contains: ['пуповинн']
  - q: надо ли давать витамин D грудничку
    source: feeding_2019
    contains: ['холекальциферол', 'рахит']

  # --- Календарь и наблюдение ----------------------------------------------
  - q: во сколько месяцев делают прививку от коклюша
    source: order_1122n
    contains: ['коклюш']
  - q: каких врачей проходить в год
    source: order_211n
    contains: ['врач']
  - q: когда проходит желтушка у новорождённого
    source: kr_jaundice_2025
    contains: ['билирубин', 'желтух']
  - q: сколько часов в сутки спит младенец
    source: who_sleep_2019
    contains: ['сна', 'часов']

# Разделы молчания здесь не дублируются: они меряют состав корпуса, а не
# формулировки вопросов, и живут в одном месте — в `kb/eval.yaml`. Вторая
# копия разошлась бы с первой ровно в тот день, когда в корпус что-нибудь
# добавят.
silence: []
absent: []
overlapping: []
