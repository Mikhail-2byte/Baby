      первое купание и уход за пуповинным остатком. Про купание в корпусе до
      него было три фрагмента и ни одного числа — это строка раздела `absent`
      в оценочном наборе, и её надо перечитать.

  - id: who_bf_counselling_1993
    tier: T2
    title: >-
      Консультирование по грудному вскармливанию: курс обучения
      (часть 2: положение у груди, трудности кормления)
    publisher: Всемирная организация здравоохранения, ЮНИСЕФ
    year: 1993
    url: https://iris.who.int/handle/10665/91603
    fetch: https://iris.who.int/server/api/core/bitstreams/02bb1f79-2785-48c1-ab6d-ae2ae216cfaa/content
    license: © ВОЗ/ЮНИСЕФ; частное использование
    note: >-
      Самый старый документ в списке, и это названо вслух. Взят ради того,
      чего нет больше нигде: как ребёнок берёт грудь, какие бывают положения и
      что делать с трещинами — включая единственное во всей базе упоминание
      ланолиновых кремов. Российские рекомендации 2024 года про трещины и
      мастит говорят, а про технику прикладывания — почти нет (пять
      упоминаний на 61 страницу).
      Курс издан четырьмя частями; взята вторая, где лежит клиника. Первая и
      третья — про сцеживание и хранение молока, это уже есть в
      `feeding_2019`; четвёртая — методика преподавания.
      Риск разойтись с документами 2024 года настоящий. Гасится тем, что уже
      написано: тир решает порядок источников под ответом, российские идут
      первыми, а промпт требует назвать оба фрагмента, если они противоречат.
      Заменить на современный курс — открытый вопрос, он лежит в
      `QUESTIONS.md`.

# Чего здесь нет намеренно:
#
# Таблиц роста ВОЗ. Их числа уже лежат в `who_lms` и считаются кодом
# (`services/growth.py`). Положить те же числа ещё и текстом — значит завести
# второй источник той же правды, который однажды разойдётся с первым.
