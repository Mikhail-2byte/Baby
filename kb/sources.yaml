# Источники базы знаний. Данные, а не код: список должен читаться и
# пополняться человеком без программирования — в идеале врачом.
#
# Правила, по которым сюда что-то попадает:
#
#   * документ действующий и у него есть автор, которого можно назвать вслух.
#     «Статья на сайте про детей» сюда не попадает никогда;
#   * текст извлекается из файла машинно. Сканы без текстового слоя не годятся:
#     распознавание добавило бы свой процент ошибок ровно там, где ошибаться
#     нельзя;
#   * лицензия позволяет частное использование. База собирается на домашней
#     машине, никуда не публикуется и в git не попадает (`kb/raw/` и
#     `kb/normalized/` в .gitignore).
#
# Поля:
#   url    — ссылка, которую бот покажет человеку. Должна открываться в браузере
#   fetch  — прямая ссылка на файл. Часто это НЕ url: официальная публикация
#            бывает сканом, а машиночитаемая копия лежит в другом месте
#   manual — файл не скачивается автоматически; кладётся руками в kb/raw/docs/

tiers:
  T1: Нормативные акты и клинические рекомендации Минздрава России
  T2: ВОЗ и национальные методические рекомендации России
  T3: Зарубежные профессиональные общества
  T4: Прочее

# Тир — не украшение. Сегодня он решает две вещи: порядок источников под
# ответом (первым идёт тир поменьше) и подпись над группой, когда в одном
# ответе сошлись документы разного веса. Случай не выдуманный: на этапе 5
# российский порог 37.5 °C разошёлся с международными 38.0, и правильным
# оказался российский — семья пойдёт к российскому педиатру.
#
# Третье применение — разведение равных в ранжировании — заработало 19.09.2026,
# когда у поиска появилась вторая выдача, по смыслу. При одной выдаче ничьих не
# бывало вовсе: места разные, значит и счета разные. Теперь RRF складывает два
# места, и совпадения стали обычным делом, см. `kb.TIER_BONUS`.

