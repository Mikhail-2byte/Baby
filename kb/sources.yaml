    note: >-
      Положен 19.09.2026, по живому вопросу из чата: «можно ли мазать соски
      ланолином и не опасно ли кормить ребёнка». До этого дня про уход за
      грудью в базе был ровно один абзац на шесть документов, и бот честно
      молчал. Здесь МКБ N64.0 — трещина соска — и вся группа O91, то есть
      инфекции груди, связанные с кормлением. Действующий российский документ
      по теме, а не пересказ.

