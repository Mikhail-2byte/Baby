# Конфиг pytest. Отдельного `pytest.ini` нет: настройки инструментов держим
# в одном каноническом файле. Метаданных пакета здесь нет намеренно —
# проект не устанавливается, а запускается из корня (`python -m bot`), и
# зависимости живут в `requirements.txt`, который Dockerfile ставит
# отдельным слоем ради кеша.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# 100 — замер, а не вкус: длиннее в проекте нет ни одной строки. Основная масса
# уложена в 88, но переносы расставлены руками и по смыслу, а не по ширине.
#
# `ruff format` поэтому в проект НЕ заводится и в CI не стоит. Он переформатирует
# 45 файлов из 72, не исправив ни одной ошибки: при 100 «разворачивает» обратно
# уже перенесённые вызовы, при 88 ломает те, что специально оставлены в строку.
# Линтер ловит ошибки, форматтер здесь только создаёт шум — проверено прогоном
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F — базовые ошибки, I — порядок импортов, UP — устаревшие конструкции,
# B — ловушки bugbear, SIM — упрощения. ANN и D намеренно не берём:
# докстринги здесь пишутся по смыслу, а не по формальной схеме
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Тесты лезут в приватные имена модулей намеренно: `panel._tasks`,
# `pending._asks`, `backup._failed_on` — это и есть предмет проверки
"tests/*" = ["SLF001"]
# Ревизии — дословный вывод `alembic revision --autogenerate` по его шаблону.
# Приводить их к стилю проекта бессмысленно: следующая автогенерация напишет
# ровно так же, и линтер будет переписывать каждую новую ревизию сразу после
# создания. Уже накатанную ревизию к тому же не редактируют вовсе —
# исправленная задним числом миграция расходится с тем, что реально
# выполнилось на боевой базе. Проверяем только то, что ловит настоящие ошибки
"alembic/versions/*" = ["E501", "I001", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["bot"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

# Домен, БД, сервисы и тексты проверяются полностью и проходят чисто. Ослабление
# ниже касается только слоя, который разговаривает с aiogram.
[[tool.mypy.overrides]]
module = "bot.handlers.*"
# aiogram объявляет `call.message` как `Message | InaccessibleMessage | None`,
# `message.from_user` — как `User | None`. Для этого бота ни один из вариантов
# `None` невозможен: до хендлера доходят только апдейты, прошедшие `IN_GROUP`
# или `IN_GROUP_CB`. Строгая проверка требовала бы здесь россыпи `assert`,
# которые ничего не проверяют, но меняют поведение: упавший `assert` — это
# потерянный апдейт, а фильтр области видимости уже стоит.
#
# Отключено ровно три кода и ровно в одном слое. `bot/services`, `bot/db`,
# `bot/texts.py`, `bot/keyboards.py`, `bot/middlewares.py` проверяются целиком —
# именно там живёт логика, которую есть смысл сверять типами: расчёт центилей,
# обрезка событий по границам суток, конвертация времени.
disable_error_code = ["union-attr", "arg-type", "assignment"]
