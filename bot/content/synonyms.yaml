# Словарь синонимов для поиска по базе знаний.
#
# Данные, а не код: файл должен читаться и пополняться человеком без
# программирования — в идеале врачом. То же место в укладе, что у
# `redflags.yaml` и `weeks.yaml`.
#
# Зачем он есть. Документ и семья говорят разными словами, и у пары часто нет
# ни одной общей основы: документ пишет «вакцинация против туберкулёза», семья
# спрашивает «БЦЖ». Стемминг тут бессилен — он приводит к одной основе
# словоформы, а не синонимы.
#
# Почему это стало обязательным, а не украшением. Сторож молчания считает
# незнакомые базе слова доводом против релевантности (см. `kb._significant`).
# Аббревиатура, которой в документах нет, — как раз незнакомое слово, и без
# словаря сторож глушит ровно те вопросы, на которые ответ есть. Проверено:
# без этого файла «когда делать прививку АКДС» и «запор у грудничка что
# делать» уходили в молчание.
#
# Правила, по которым сюда что-то попадает:
#
#   * группа связывает слово семьи со словом документа, и в `why` сказано,
#     какой документ каким словом говорит. Группа без этого не попадает:
#     иначе через год никто не восстановит, зачем строка стоит;
#   * пары берутся из `data/qa.log` — там видно, на чём бот молчал у живой
#     семьи, — и из оглавлений документов. **Не из промахов `kb/eval.yaml`**:
#     словарь, написанный по промахам оценочного набора, — это подгонка, и
#     набор после неё меряет сам себя;
#   * многозначное слово не берётся. «Стул» у мебели и у младенца — разные
#     вещи, «сон» и «отдых» открыли бы дорогу вопросу про отпуск. Расширение
#     делает покрытие мягче, то есть работает против сторожа молчания;
#   * расширяется только запрос, не индекс. Расширенный индекс размножил бы
#     мусор и сломал `df`, на которых стоит вся значимость слов.
#
# Группа — список равноправных написаний: любое из них в вопросе подставляет
# все остальные. Фраза из нескольких слов считается найденной, только если во
# фрагменте есть все её слова.
#
# Слово с беглой гласной пишется обеими формами: «грудничок» и «грудничка».
# Snowball даёт им разные основы (`грудничок` и `грудничк`), и ни одна не
# является началом другой — то же, что у «прививка»/«прививок», о чём
# предупреждает докстрока `services/morph.py`. Одной формы тут не хватает, и
# проверить это можно только тестом, а не глазами.

groups:
  - phrases: [акдс, "коклюш дифтерия столбняк", "коклюшно-дифтерийно-столбнячная"]
    why: >-
      Приказ 1122н называет вакцину по болезням, от которых она защищает, а в
      семье её знают только аббревиатурой. Слова «АКДС» в документе нет.

  - phrases: [бцж, "против туберкулеза", туберкулез]
    why: >-
      То же самое: 1122н пишет «вакцинация против туберкулёза». «БЦЖ»
      встречается в базе один раз, «туберкулёз» — тринадцать.

  - phrases: [грудничок, грудничка, "грудной ребенок", "детей грудного возраста",
              младенец, младенца]
    why: >-
      Разговорное слово, которого в клинических рекомендациях нет вовсе. Без
      него «запор у грудничка» уходило в молчание, хотя глава про запоры есть.

  - phrases: [газики, газы, метеоризм, газообразование]
    why: >-
      Семейное слово, которого в клинических рекомендациях нет. Документы
      пишут «метеоризм» и «газообразование»; «газики» не встречается ни разу.

  - phrases: ["хватает молока", "достаточно молока", "достаточность лактации"]
    why: >-
      Программа оптимизации вскармливания 2019 пишет «достаточность лактации»;
      родитель спрашивает «хватает ли молока».

  - phrases: ["сколько спать", "продолжительность сна", "длительность сна"]
    why: >-
      Руководство ВОЗ по сну пишет «продолжительность сна». Общих основ с
      «сколько спать» нет ни одной.

  - phrases: [мультики, планшет, "экранное время"]
    why: >-
      ВОЗ пишет «экранное время»; в семье это «мультики» и «планшет».

  - phrases: ["каких врачей", "врачи-специалисты", "врачами-специалистами"]
    why: >-
      Приказ 211н перечисляет «врачей-специалистов». Вопрос «каких врачей
      проходят в год» не пересекался с ним ни одной основой.

  - phrases: [свдс, "внезапной детской смерти", "внезапная смерть младенца"]
    why: >-
      Аббревиатура, которой в русских документах почти нет. Стоит здесь
      заранее: тема безопасного сна в базе не покрыта, и пока источника нет,
      бот обязан на неё молчать — а не отвечать по слову «сон».
