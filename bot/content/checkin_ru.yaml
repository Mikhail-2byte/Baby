# Периодический опрос «Что было с прошлого раза?».
#
# Пятый файл содержания, и правило то же: это данные, а не код. В Python нет
# ни одной подписи кнопки, ни одного сдвига «когда» и ни одной границы ночного
# окна — всё здесь, и правится без программирования.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ СЕКЦИЯ В schedule_ru.yaml
#
# Тот файл целиком про нормативные документы: его сторож требует `source` у
# каждого пресета и у каждой записи календаря. У опроса источника нет и быть
# не может — подписи кнопок не следуют из приказа. Положить его туда значило
# бы либо соврать ссылкой на 1122н, либо завести в стороже исключение, а файл,
# чей сторож начинается со слова «кроме», — это сторож, который держат
# выключенным.
#
# ЧЕГО ЗДЕСЬ НЕТ И НЕ БУДЕТ
#
# Настройки «включить опрос всем разом». Интервал лежит в БД, по семье, и
# включается тапом в /remind; выключено по умолчанию. Бот молчит, пока его не
# попросили, — и особенно молчит тот бот, который сам начинает задавать
# вопросы.

version: "2026-09-15"

icon: "🕒"
title: Что было с прошлого раза?
# Короткое имя для строки на экране /remind: заголовок целиком там не
# помещается и читается как вопрос, заданный экрану настроек.
short: Опрос
question: Отметьте, что не успели записать кнопками.

# Интервалы, часы. Первый экран /remind спрашивает интервал до включения —
# ровно как у почасового пресета кормления.
choices: [3, 4, 6]
default_hours: 3

# Ночное окно по ЛОКАЛЬНОМУ времени семьи: в него опрос не приходит вовсе.
# Границы здесь, а не в коде: семья, у которой ребёнок спит иначе, правит
# файл. Окно переваливает через полночь, и код это знает.
quiet:
  from: "23:00"
  to: "07:00"

# Второй экран, «Когда?». `minutes` вычитается из момента НАЖАТИЯ, а не из
# момента, когда карточка пришла: человек называет время относительно
# «сейчас», а карточка может пролежать в чате час.
#
# Список обязан начинаться с нуля и идти по возрастанию: ряд
# «час назад / сейчас / 3 ч» читается только на свежую голову.
shifts:
  - { minutes: 0, label: сейчас }
  - { minutes: 30, label: 30 мин назад }
  - { minutes: 60, label: час назад }
  - { minutes: 120, label: 2 ч назад }
  - { minutes: 180, label: 3 ч назад }

# Виды на карточке. `kind` обязан совпадать с константой из bot/db/models.py:
# опечатка уедет в events видом, которого не знает ни одна сводка, и лежать
# там будет вечно.
#
# `durations` обязателен у длящихся видов и запрещён у мгновенных. Без него
# запись «кормление час назад» создала бы идущий таймер, который тикер через
# четыре часа закроет как измеренный — в отчёте для педиатра это выглядит как
# честно засечённый четырёхчасовой сон.
#
# Числа длительности называет человек третьим тапом. Значения по умолчанию
# здесь нет намеренно: подставленное файлом число попало бы в дневник, не
# будучи названным вслух, и отличить его от измеренного было бы нечем.
kinds:
  - { kind: feed_breast, icon: "🤱", label: Кормление, durations: [10, 15, 20, 30] }
  - { kind: sleep, icon: "😴", label: Сон, durations: [30, 60, 120, 180] }
  - { kind: diaper_wet, icon: "💧", label: Мокрый }
  - { kind: diaper_dirty, icon: "💩", label: Стул }
  - { kind: feed_bottle, icon: "🍼", label: Бутылочка }

nothing_label: "✖️ Ничего не было"
mute_label: "🔕 Не спрашивать"
still_label: "⏳ Ещё идёт"
