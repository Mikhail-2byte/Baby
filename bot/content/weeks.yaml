# Что происходит на этой неделе: развитие, чем заниматься, о чём говорить.
#
# Второй файл содержания после `redflags.yaml`, и правила те же: весь текст
# живёт здесь, в Python нет ни одной фразы. Правьте здесь.
#
# ЭТО НЕ ГЕНЕРИРУЕТСЯ МОДЕЛЬЮ И НЕ БУДЕТ. Самые читаемые сообщения бота —
# те, что приходят сами, каждую неделю, и читаются как «так и должно быть».
# Сочинённый текст в этом месте один раз ошибётся, и доверия к остальному
# уже не будет.
#
# ГРАНУЛЯРНОСТЬ намеренно неровная: первые недели идут по одной, дальше
# периоды укрупняются. Это не лень, а форма самого предмета — между первой и
# второй неделей жизни разницы больше, чем между седьмым и восьмым месяцем.
#
# У каждого совета в `do` и `talk` указан источник. Там, где источника нет,
# совета быть не должно.
#
# ЧЕГО ЗДЕСЬ НЕТ И НЕ БУДЕТ:
#   * «скачков роста» по календарю Wonder Weeks — исходное исследование
#     (15 пар мать-ребёнок, опросники) не воспроизвелось при попытке
#     репликации с измерением гормонов стресса;
#   * обучения сну в любом виде до 4–6 месяцев;
#   * норм «сколько должен спать» и «сколько должен съедать» — они сильно
#     индивидуальны, а сравнение с чужой нормой тревожит, ничего не давая.

version: "2026-09-13"

sources:
  - CDC «Learn the Signs. Act Early», чек-листы вех 2/4/6/9/12 месяцев (ред. 2022)
  - WHO Motor Development Study, окна достижения шести моторных вех (2006)
  - Harvard Center on the Developing Child, Serve and Return
  - Ferjan Ramírez, Roseberry Lytle, Kuhl, PNAS 2020 — коучинг родителей и речь
  - WHO Guidelines on physical activity, sedentary behaviour and sleep, 0–5 лет (2019)
  - AAP, Sleep-Related Infant Deaths: Updated 2022 Recommendations
  - Hewitt et al., Tummy Time and Infant Health Outcomes, Pediatrics 2020
  - Cochrane CD003519, Early skin-to-skin contact
  - КР МЗ РФ «Здоровый новорождённый», 2025

# Оговорка, которая идёт с каждым списком вех. Формулировка CDC дословно:
# «Developmental milestones are things most children (75% or more) can do by a
# certain age». Это порог «пора спросить у врача», а не «норма развития»
milestone_caveat: >-
  Вехи CDC — это то, что умеют 75% детей к этому возрасту. Не норма, которой
  надо соответствовать, а порог, после которого стоит спросить у педиатра.
  Половина здоровых детей что-то из списка делает раньше, кто-то позже.

periods:
  - from_day: 0
    to_day: 6
    title: Первая неделя
    happening: >-
      Она привыкает жить снаружи. Спит почти всё время и просыпается есть —
      восемь-двенадцать раз в сутки, чаще ночью, чем днём. Вес в первые дни
      снижается, это физиология, а не проблема: к двум неделям он обычно
      возвращается к тому, что был при рождении.
    do:
      - text: >-
          Держите кожа к коже как можно больше. Это не нежность ради нежности:
          контакт помогает установиться лактации, стабилизирует температуру и
          дыхание ребёнка и снижает плач.
        source: Cochrane CD003519
      - text: >-
          Кормите по требованию, включая ночь, и не выдерживайте паузы. Если
          она спит дольше шести часов подряд — разбудите и приложите.
        source: КР МЗ РФ «Здоровый новорождённый» 2025
      - text: >-
          Считайте мокрые подгузники. С пятого дня их обычно шесть и больше за
          сутки — это самый простой способ понять, что молока хватает.
        source: AAP, La Leche League
    talk:
      - text: >-
          Разговаривайте с ней обычными словами, а не звуками. Она не понимает
          смысла, но различает ваш голос с рождения и успокаивается на него.
        source: Harvard, Serve and Return
      - text: >-
          Называйте вслух то, что делаете: «сейчас поменяем подгузник», «идём
          купаться». Связь между словом и происходящим начинает строиться
          задолго до первого понятого слова.
        source: Harvard, Serve and Return
    safety:
      - text: >-
          Спать — на спине, в своей кроватке, на жёстком матрасе. Без подушки,
          одеяла, бортиков и игрушек. Совместный сон в одной кровати — риск
          падения и удушения.
        source: AAP Safe Sleep 2022, КР МЗ РФ 2025
    normal:
      - Потеря веса в первые дни — до 10% от массы при рождении.
      - Стул меняет цвет от чёрного к жёлтому за первую неделю.
      - Чихает, икает, вздрагивает во сне, дышит неровно — всё это норма.

  - from_day: 7
    to_day: 13
    title: Вторая неделя
    happening: >-
      Вес пошёл вверх — обычно граммов по двадцать-тридцать в сутки. Она чаще
      бывает в спокойном бодрствовании: глаза открыты, не плачет, смотрит.
      Это и есть окно, в котором с ней стоит общаться.
    do:
      - text: >-
          Ловите спокойное бодрствование и проводите его лицом к лицу, на
          расстоянии примерно 25 сантиметров — дальше она пока плохо видит.
        source: Harvard, Serve and Return
      - text: >-
          Начинайте выкладывать на живот, пока она бодрствует и вы рядом.
          Сначала одна-две минуты несколько раз в день; можно на вашей груди.
        source: WHO 2019, Hewitt et al. 2020
    talk:
      - text: >-
          Высовывайте язык и медленно открывайте рот, когда она смотрит на
          вас. Некоторые новорождённые повторяют — это первая игра в очередь.
        source: Harvard, Serve and Return
    safety:
      - text: >-
          На животе — только бодрствуя и под присмотром. Уснула на животе —
          переложите на спину.
        source: AAP Safe Sleep 2022
    normal:
      - Плач нарастает и обычно достигает пика к шестой-восьмой неделе.
      - Ест каждые полтора-три часа, иногда подряд несколько раз — это не «мало молока».

  - from_day: 14
    to_day: 27
    title: Третья и четвёртая недели
    happening: >-
      Вес вернулся к тому, что был при рождении, и растёт дальше. Она дольше
      удерживает взгляд и начинает следить за медленно движущимся лицом.
      Вечерний плач у многих усиливается — это самый тяжёлый период первых
      месяцев, и он пройдёт.
    do:
      - text: >-
          Доведите время на животе до получаса в сутки суммарно, дробно.
          Полчаса — это норма ВОЗ, а не идеал: складывается из многих коротких
          подходов.
        source: WHO 2019
      - text: >-
          Носите на руках и в слинге столько, сколько хочется. Избаловать
          новорождённого ношением нельзя — такого механизма не существует.
        source: Harvard, Serve and Return
      - text: >-
          Про вечерний плач: проверьте голод, подгузник, жарко-холодно, потом
          просто держите на руках. Если плач не унимается часами каждый день —
          это к педиатру, а не к терпению.
        source: NHS
    talk:
      - text: >-
          Говорите нараспев, высоким голосом, растягивая гласные — это
          «parentese». Настоящими словами, а не сюсюканьем: в исследовании с
          коучингом родителей именно такая речь увеличивала число ответных
          звуков ребёнка и словарь к полутора годам.
        source: Ferjan Ramírez et al., PNAS 2020
      - text: >-
          Делайте паузу после того, как что-то сказали. Пауза — приглашение
          ответить, и именно обмены репликами, а не количество услышанных
          слов, связаны с развитием речи.
        source: Ferjan Ramírez et al., PNAS 2020
    normal:
      - Вечерний плач без причины у многих детей; пик приходится на 6–8 неделю.
      - Срыгивает после кормлений — нормально, если набирает вес и не бьёт фонтаном.

  - from_day: 28
    to_day: 41
    title: Пятая и шестая недели
    happening: >-
      Где-то в этом промежутке появляется первая настоящая улыбка в ответ на
      ваше лицо — не гримаса во сне, а именно ответ. Она начинает издавать
      звуки, кроме плача.
    do:
      - text: >-
          Улыбайтесь в ответ сразу и заметно. Ответ на её сигнал — и есть
          механизм, на котором строится и привязанность, и речь.
        source: Harvard, Serve and Return
      - text: >-
          Показывайте контрастные картинки и своё лицо. Лицо интереснее любой
          развивающей игрушки, и это не фигура речи.
        source: Harvard, Serve and Return
    talk:
      - text: >-
          Когда она издала звук — ответьте на него, как на реплику. Повторите
          и добавьте своё. Это буквально первая беседа, и очередь в ней важнее
          содержания.
        source: Harvard, Serve and Return
    normal:
      - Плач на пике. Дальше будет легче — это самая частая правда про этот возраст.

  - from_day: 42
    to_day: 62
    title: Седьмая — девятая недели
    happening: >-
      Плач идёт на спад. Она разглядывает свои руки, поворачивает голову на
      голос и держит голову, лёжа на животе. К двум месяцам — первый набор
      вех CDC и первый большой визит к педиатру.
    do:
      - text: >-
          Перед приёмом посмотрите /stage и /redflags, а с собой возьмите
          /export: в выгрузке есть график веса с коридорами ВОЗ.
        source: Bright Futures, CDC
      - text: >-
          Читайте вслух. Что угодно, хоть ленту новостей: важна интонация и
          то, что вы рядом, а не содержание.
        source: AAP Literacy Promotion 2024
    talk:
      - text: >-
          Называйте то, на что она смотрит. Проследите за её взглядом и
          скажите, что там: это и есть «подача и ответ» в чистом виде.
        source: Harvard, Serve and Return
    normal:
      - Может «потерять» навык на несколько дней и вернуть его. Стойкая потеря — к врачу.

  - from_day: 63
    to_day: 104
    title: Три месяца
    happening: >-
      Держит голову уверенно, опирается на предплечья лёжа на животе, тянется
      к предметам и тащит руки в рот. Гуление становится разнообразным.
      Многие в этом возрасте начинают спать длиннее ночью — но не все, и это
      тоже норма.
    do:
      - text: >-
          Давайте предметы в руку и позволяйте тащить в рот. Рот сейчас —
          главный орган изучения мира.
        source: CDC
      - text: >-
          Больше времени на животе: это связано с развитием крупной моторики,
          переворотами, ползанием и профилактикой уплощения затылка.
        source: Hewitt et al., Pediatrics 2020
    talk:
      - text: >-
          Пойте. Одни и те же песни каждый день — повторение помогает больше,
          чем разнообразие.
        source: ZERO TO THREE
    normal:
      - Экраны до года не нужны вовсе — это отдельная рекомендация ВОЗ, а не строгость.

  - from_day: 105
    to_day: 160
    title: Четыре — пять месяцев
    happening: >-
      Смеётся, тянется и хватает, поворачивается на голос, начинает
      переворачиваться. Ближе к полугоду появляется интерес к еде взрослых.
    do:
      - text: >-
          Как только начала переворачиваться — уберите из кроватки всё лишнее
          окончательно. Класть спать по-прежнему на спину, но если перевернётся
          сама во сне, переворачивать обратно не нужно.
        source: AAP Safe Sleep 2022
      - text: >-
          Не оставляйте на пеленальном столике и диване ни на секунду.
          Первое падение почти всегда происходит именно так.
        source: Общая практика неотложной помощи
    talk:
      - text: >-
          Играйте в очередь: вы звук — она звук — вы ответ. К полугоду она
          начнёт делать это сама.
        source: CDC, Harvard
    normal:
      - Прикорм — около шести месяцев, не раньше четырёх. Грудное молоко остаётся основой.

  - from_day: 161
    to_day: 250
    title: Шесть — восемь месяцев
    happening: >-
      Сидит с опорой на руки, переворачивается, тянется за игрушкой, кладёт
      всё в рот, смеётся и лепечет слогами. Появляется настороженность к
      незнакомым — это признак развития, а не характера.
    do:
      - text: >-
          Начинайте прикорм около шести месяцев, продолжая грудное
          вскармливание. Одно новое — несколько дней подряд.
        source: WHO Complementary Feeding 2023, Программа оптимизации вскармливания РФ
      - text: >-
          Уберите с пола и нижних полок всё мелкое. Проверка простая: если
          проходит в рулон от туалетной бумаги — уберите.
        source: Общая практика профилактики травм
    talk:
      - text: >-
          Играйте в «ку-ку». Она учится тому, что спрятанное продолжает
          существовать, — и это один из главных шагов этого полугодия.
        source: CDC
    normal:
      - Страх незнакомых и тревога при вашем уходе — норма этого возраста.

  - from_day: 251
    to_day: 400
    title: Девять — двенадцать месяцев
    happening: >-
      Садится сама, ползает, встаёт у опоры, ходит вдоль мебели. Лепет похож
      на речь, появляется «мама» и «папа» по адресу, понимает «нельзя».
    do:
      - text: >-
          Дайте безопасное пространство для ползания и вставания. Ходунки не
          нужны и связаны с травмами.
        source: AAP, WHO
      - text: >-
          Показывайте пальцем и просите показать в ответ. Указательный жест
          появляется раньше слов и предсказывает их.
        source: CDC, ZERO TO THREE
    talk:
      - text: >-
          Отвечайте на лепет так, будто это слова. Называйте предмет, на
          который она показала, и ждите ответа.
        source: Harvard, Serve and Return
    normal:
      - Окно самостоятельной ходьбы по данным ВОЗ — от 8,2 до 17,6 месяца. Обе границы это норма.

# Вехи CDC, дословно с чек-листов «Learn the Signs. Act Early» (ред. 2022).
# Перевод наш; английский оригинал оставлен, чтобы можно было сверить
milestones:
  - at_months: 2
    social:
      - Успокаивается, когда с ней говорят или берут на руки
      - Смотрит на ваше лицо
      - Кажется довольной, когда вы подходите
      - Улыбается, когда вы с ней говорите
    language:
      - Издаёт звуки, кроме плача
      - Реагирует на громкие звуки
    cognitive:
      - Следит за вами взглядом, когда вы двигаетесь
      - Смотрит на игрушку несколько секунд
    movement:
      - Держит голову, лёжа на животе
      - Двигает обеими руками и обеими ногами
      - Ненадолго раскрывает ладони

  - at_months: 4
    social:
      - Улыбается сама, чтобы привлечь ваше внимание
      - Посмеивается, когда вы её смешите
      - Смотрит, двигается или издаёт звуки, чтобы вы обратили внимание
    language:
      - Гулит — «ооо», «ааа»
      - Отвечает звуками, когда вы с ней говорите
      - Поворачивает голову на звук вашего голоса
    cognitive:
      - Открывает рот при виде груди или бутылочки, если голодна
      - С интересом разглядывает свои руки
    movement:
      - Держит голову без поддержки, когда вы держите её на руках
      - Удерживает игрушку, если вложить ей в руку
      - Машет рукой по игрушкам
      - Тянет руки в рот
      - Приподнимается на предплечьях, лёжа на животе

  - at_months: 6
    social:
      - Узнаёт знакомых людей
      - Любит разглядывать себя в зеркале
      - Смеётся
    language:
      - Обменивается с вами звуками по очереди
      - Пускает пузыри, высовывая язык
      - Взвизгивает
    cognitive:
      - Тянет предметы в рот, чтобы изучить их
      - Тянется и хватает игрушку, которую хочет
      - Закрывает рот, показывая, что больше не хочет есть
    movement:
      - Переворачивается с живота на спину
      - Отжимается на прямых руках, лёжа на животе
      - Сидя, опирается на руки

  - at_months: 9
    social:
      - Стесняется, льнёт к своим или пугается незнакомых
      - Показывает разные выражения лица: радость, грусть, злость, удивление
      - Оборачивается, когда её зовут по имени
      - Реагирует на ваш уход — смотрит, тянется, плачет
      - Улыбается или смеётся в игре «ку-ку»
    language:
      - Произносит много разных звуков вроде «мамамама» и «бабабаба»
      - Поднимает руки, прося взять на руки
    cognitive:
      - Ищет предмет, который уронила и потеряла из виду
      - Стучит двумя предметами друг о друга
    movement:
      - Садится сама
      - Перекладывает предмет из руки в руку
      - Подгребает еду пальцами к себе
      - Сидит без поддержки

  - at_months: 12
    social:
      - Играет с вами в игры вроде «ладушек»
    language:
      - Машет «пока-пока»
      - Зовёт родителя «мама», «папа» или другим особым именем
      - Понимает «нельзя» — замирает или останавливается
    cognitive:
      - Кладёт предмет в ёмкость, например кубик в чашку
      - Ищет то, что вы спрятали у неё на глазах, например игрушку под пелёнкой
    movement:
      - Подтягивается и встаёт
      - Ходит, держась за мебель
      - Пьёт из чашки без крышки, когда вы её держите
      - Берёт мелкое двумя пальцами — большим и указательным

# Окна достижения шести моторных вех, WHO Multicentre Growth Reference Study.
# Границы — возраст в месяцах, внутри которого веху осваивают 99% детей.
# Ширина окон и есть главное сообщение: «ходит в год» — это середина, а не норма
#
# Все шесть пар сверены со скачанной таблицей ВОЗ (колонки Left-bound и
# Right-bound), 13.09.2026, расхождений нет:
# cdn.who.int/media/docs/default-source/child-growth/child-growth-standards/
