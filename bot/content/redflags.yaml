# Тревожные признаки у ребёнка первого года жизни.
#
# Это ЕДИНСТВЕННОЕ место, где живёт медицинское содержание триажа. Код в
# `bot/services/redflags.py` умеет только искать фразы и сравнивать числа —
# он не знает ни одного симптома и ни одного порога.
#
# Файл сделан данными, а не кодом, ровно затем, чтобы его мог прочитать и
# поправить человек без программирования: родитель, а лучше — знакомый врач.
# Если что-то здесь кажется неверным, правьте здесь, не трогая Python.
#
# ПОРОГИ И ФОРМУЛИРОВКИ — из NICE NG143 («светофор» оценки риска тяжёлой
# болезни у детей до 5 лет), WHO IMCI (модуль Sick Young Infant, 0–2 мес) и
# клинических рекомендаций Минздрава РФ «Здоровый новорождённый» (2025).
#
# `level`:
#   emergency — звонить 103 сейчас, не откладывая до утра
#   urgent    — связаться с врачом сегодня
#
# `age_max_days` / `age_min_days` — границы, вне которых флаг не срабатывает.
# Возраст скорректированный, тот же, по которому считаются центили.
#
# `phrases` — как это пишут родители в чате, а не как это называется в
# учебнике. Регистр и «ё» не важны. Фраза, уже содержащая отрицание
# («не просыпается»), подавлению по отрицанию не подлежит — см. код.
#
# `examples` — целые сообщения, какими они приходят в чат. Каждое из них тест
# прогоняет через триаж и требует, чтобы поднялся именно этот признак. Это
# единственная проверка, у которой есть зубы: совпадение фразы с самой собой
# тавтологично и не ловит ничего, а пример ловит и опечатку в фразе, и
# сломавшееся подавление отрицаний, и съехавшую нормализацию.

version: "2026-09-13"

sources:
  - NICE NG143, Fever in under 5s — traffic light system
  - WHO IMCI, Sick Young Infant (0–2 months), danger signs
  - Клинические рекомендации МЗ РФ «Здоровый новорождённый», 2025
  - NHS, Sepsis in babies and children
  - «Красные флаги у детей первого года жизни», ДРКБ МЗ РТ

# Числовые пороги. Отдельно от фраз: их сравнивает код, а не ищет в тексте
thresholds:
  # Температура. Порог 38.0 у ребёнка младше 3 месяцев — консенсус AAP, NHS и
  # NICE, и это самый важный порог во всём файле
  fever_c: 38.0
  fever_age_days: 90
  # Российская педиатрическая практика строже международной: памятки для
  # родителей называют поводом обратиться уже 37.5 у детей до 3 месяцев.
  # Держим оба: 38.0 — звонить в скорую, 37.5 — связаться с врачом. Семья
  # пойдёт к российскому педиатру, и бот не должен расходиться с тем, что ей
  # там скажут
  fever_c_watch: 37.5
  # После 3 месяцев тот же уровень тревоги начинается выше. 38.5 — из
  # российских памяток; NICE ставит жёлтую зону на 39.0 для 3–6 месяцев
  fever_c_older: 38.5
  # Гипотермия у младенца — такой же признак сепсиса, как и лихорадка
  hypothermia_c: 36.0
  # Диапазон, в котором число вообще считается температурой
  temp_min_c: 34.0
  temp_max_c: 43.0
  # Частота дыхания в минуту
  breathing_rate: 60
  # Мокрых подгузников за сутки, начиная с 5-го дня жизни
  min_wet_diapers: 4
  wet_diapers_from_day: 5
  # Потеря массы от веса при рождении, процентов
  weight_loss_percent: 10
  # Перерыв между кормлениями у новорождённого, часов
  feeding_gap_hours: 6
  feeding_gap_age_days: 60
  # Желтуха: в первые сутки и дольше двух недель — поводы для осмотра
  jaundice_early_hours: 24
  jaundice_late_days: 14

flags:
  # --- Экстренные -------------------------------------------------------

  - id: not_waking
    level: emergency
    title: Ребёнка трудно разбудить или он не реагирует
    action: >-
      Звоните 103. Вялость, необычная сонливость и слабая реакция на
      обращение у младенца — признак, при котором осмотр нужен немедленно.
    source: NICE NG143 (красная зона), WHO IMCI
    examples:
      - уже полчаса не могу разбудить, обмякла
      - она совсем не реагирует на голос
    phrases:
      - не просыпается
      - не могу разбудить
      - не удаётся разбудить
      - не реагирует
      - никак не реагирует
      - не отзывается
      - без сознания
      - очень вялая
      - очень вялый
      - вялая совсем
      - как тряпочка
      - обмякла
      - обмяк

  - id: breathing
    level: emergency
    title: Трудное или шумное дыхание
    action: >-
      Звоните 103. Кряхтящее дыхание, втяжения под рёбрами и частое дыхание
      у младенца требуют немедленной оценки.
    source: NICE NG143 (красная зона), NHS Sepsis
    examples:
      - дышит очень часто и кряхтит при дыхании
      - кажется тяжело дышит, втягиваются рёбра
    phrases:
      - тяжело дышит
      - трудно дышит
      - задыхается
      - хрюкает при дыхании
      - кряхтит при дыхании
      - стонет при дыхании
      - втягивает рёбра
      - втягиваются рёбра
      - втяжения
      - западает грудная клетка
      - часто дышит
      - дышит часто
      - перестала дышать
      - перестал дышать
      - апноэ
      - остановка дыхания
      - раздувает крылья носа
      - раздуваются крылья носа

  - id: colour
    level: emergency
    title: Синюшность, бледность или мраморность кожи
    action: >-
      Звоните 103. Изменение цвета кожи, губ или языка у младенца — признак,
      при котором ждать нельзя.
    source: NICE NG143 (красная зона), NHS Sepsis
    examples:
      - губы синие, что делать
      - кожа мраморная и очень бледная
    phrases:
      - посинела
      - посинел
      - синеет
      - синие губы
      - губы синие
      - синий носогубный
      - носогубный треугольник
      - серая кожа
      - землистая
      - мраморная кожа
      - кожа мраморная
      - очень бледная
      - очень бледный

  - id: rash
    level: emergency
    title: Сыпь, не бледнеющая при надавливании
    action: >-
      Звоните 103. Проверка простая: прижмите к сыпи дно стакана. Если пятна
      не бледнеют под стеклом — это повод вызывать скорую немедленно.
    source: NHS Sepsis, NICE NG143 (красная зона)
    examples:
      - появилась сыпь и она не бледнеет при надавливании
      - по телу звёздочки на коже
    phrases:
      - сыпь не бледнеет
      - не бледнеет при надавливании
      - сыпь не исчезает при надавливании
      - звёздочки на коже
      - геморрагическая сыпь
      - синячки по телу
      - петехии

  - id: seizure
    level: emergency
    title: Судороги
    action: >-
      Звоните 103. Запомните время начала и продолжительность — это спросят
      первым делом.
    source: NICE NG143 (красная зона), WHO IMCI
    examples:
      - у неё судороги!!!
      - закатила глаза и трясётся всем телом
    phrases:
      - судороги
      - судорога
      - конвульсии
      - закатывает глаза
      - закатила глаза
      - трясётся всем телом
      - дёргается всем телом
      - подёргивания конечностей

  - id: fontanelle
    level: emergency
    title: Выбухающий родничок
    action: >-
      Звоните 103. Напряжённый, выступающий родничок в спокойном состоянии —
      признак повышенного внутричерепного давления.
    source: NICE NG143 (красная зона)
    examples:
      - родничок выбухает, когда она спокойна
      - напряжённый родничок с утра
    phrases:
      - родничок выбухает
      - родничок выпирает
      - родничок набух
      - выбухающий родничок
      - напряжённый родничок
      - родничок выпуклый

  - id: feeding_refusal
    level: emergency
    title: Полный отказ от еды
    action: >-
      Звоните 103 или в неотложную помощь. Младенец, который совсем не берёт
      грудь или бутылочку, обезвоживается быстро.
    source: WHO IMCI (не может пить или сосать грудь)
    examples:
      - совсем не ест с ночи
      - отказывается от груди второе кормление подряд
    phrases:
      - совсем не ест
      - совсем не пьёт
      - не берёт грудь совсем
      - отказывается от груди
      - отказывается от еды
      - не может сосать
      - не сосёт вообще

  - id: vomiting_all
    level: emergency
    title: Рвота всем съеденным, рвота фонтаном
    action: >-
      Звоните 103. Если ребёнок не удерживает ничего из съеденного,
      обезвоживание наступает за часы.
    source: WHO IMCI
    examples:
      - рвёт фонтаном после каждого кормления
      - зелёная рвота была
    phrases:
      - рвота фонтаном
      - рвёт фонтаном
      - рвёт всем
      - рвота всем съеденным
      - не удерживает еду
      - всё срыгивает обратно фонтаном
      - зелёная рвота
      - рвота с зеленью
      - оливковая рвота
      - рвота жёлтого цвета

  # --- Срочные, но не экстренные ---------------------------------------

  - id: cry
    level: urgent
    title: Необычный крик
    action: >-
      Свяжитесь с врачом сегодня. Непрерывный, пронзительный или, наоборот,
      слабый стонущий плач — повод для очного осмотра.
    source: NICE NG143 (красная и жёлтая зоны)
    examples:
      - пронзительный крик уже час
      - плачет не переставая с обеда
    phrases:
      - пронзительный крик
      - монотонный крик
      - непрерывно плачет
      - плачет не переставая
      - кричит не переставая
      - стонет
      - слабый писк вместо плача
      - плачет на одной ноте

  - id: dehydration
    level: urgent
    title: Признаки обезвоживания
    action: >-
      Свяжитесь с врачом сегодня. Сухие губы, запавший родничок, мало мочи и
      отсутствие слёз — признаки нехватки жидкости.
    source: NICE NG143 (жёлтая зона)
    examples:
      - родничок запал и сухие губы
      - весь день почти не писает
    phrases:
      - запавший родничок
      - родничок запал
      - запавшие глаза
      - сухие губы
      - сухой язык
      - нет слёз
      - плачет без слёз
      - мало писает
      - почти не писает
      - сухой подгузник весь день
      - сухой подгузник уже шесть часов
      - не писала шесть часов
      - тёмная моча

  - id: jaundice
    level: urgent
    title: Желтуха
    action: >-
      Свяжитесь с врачом. Отдельно тревожно, если желтизна появилась в первые
      сутки жизни, нарастает день ото дня или держится дольше двух недель.
    source: КР МЗ РФ «Неонатальная желтуха» 2025, NHS
    examples:
      - мне кажется она пожелтела
      - белки глаз жёлтые стали
    phrases:
      - пожелтела
      - пожелтел
      - желтеет
      - жёлтая кожа
      - жёлтые белки
      - белки глаз жёлтые
      - желтуха усиливается
      - желтушка усиливается

  - id: fever_duration
    level: urgent
    title: Температура держится пятый день
    action: >-
      Свяжитесь с врачом. Лихорадка дольше пяти дней требует очного осмотра
      независимо от самочувствия.
    source: NICE NG143 (жёлтая зона)
    examples:
      - температура пятый день держится
      - температура не спадает несколько дней уже
    phrases:
      - температура пятый день
      - температура пять дней
      - температура держится неделю
      - температура не спадает несколько дней

  - id: injury
    level: emergency
    title: Падение или травма головы
    action: >-
      Звоните 103. После падения с высоты, удара головой, а особенно после
      рвоты или сонливости вслед за ним, нужен осмотр.
    source: Общая практика неотложной помощи
    examples:
      - упала с пеленального столика
      - ударилась головой об бортик
    phrases:
      - упала с пеленального
      - упал с пеленального
      - упала с кровати
      - упал с кровати
      - ударилась головой
      - ударился головой
      - уронили
      - выпала из
      - выпал из

  - id: skills_lost
    level: urgent
    title: Потеря того, что ребёнок уже умел
    action: >-
      Свяжитесь с врачом. Утрата уже освоенного навыка — перестал следить
      взглядом, улыбаться, держать голову, гулить — повод для осмотра сама по
      себе, даже если в остальном всё спокойно.
    source: CDC Learn the Signs Act Early, ДРКБ МЗ РТ
    examples:
      - перестала следить взглядом, раньше следила
      - разучилась держать голову
    phrases:
      - перестала следить взглядом
      - перестал следить взглядом
      - разучилась
      - разучился
      - перестала улыбаться
      - перестал улыбаться
      - перестала гулить
      - перестал гулить
      - потеряла навык

  - id: stridor
    level: emergency
    title: Лающий кашель, шумный вдох
    action: >-
      Звоните 103. Внезапный лающий кашель с трудным шумным вдохом, особенно
      ночью, — картина крупа. До приезда: возьмите на руки, успокойте, не
      укладывайте насильно, откройте окно.
    source: ДРКБ МЗ РТ, общая практика неотложной помощи
    examples:
      - лающий кашель начался ночью
      - шумный вдох и кашель как лай
    phrases:
      - лающий кашель
      - кашель как лай
      - шумный вдох
      - свистящий вдох
      - тяжело вдохнуть

  - id: head_tilt
    level: emergency
    title: Запрокидывание головы назад в покое
    action: >-
      Звоните 103. Вынужденное запрокидывание головы у бодрствующего ребёнка —
      неврологический признак, при котором осмотр нужен немедленно.
    source: ДРКБ МЗ РТ
    examples:
      - запрокидывает голову назад когда не спит
      - выгибается дугой и запрокидывает голову
    phrases:
      - запрокидывает голову
      - запрокидывание головы
      - выгибается дугой
