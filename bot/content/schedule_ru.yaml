# Календарь прививок и профилактических осмотров, и то, о чём бот напоминает.
#
# Третий файл содержания после redflags.yaml и weeks.yaml, и правила те же:
# это данные, а не код. В Python нет ни одной даты прививки, ни одной дозы и
# ни одного названия врача — всё здесь. Файл должен читаться и правиться
# человеком без программирования, в идеале врачом.
#
# Откуда взято:
#
#   * прививки — национальный календарь, приложение N 1 к приказу Минздрава
#     России от 06.12.2021 N 1122н (в ред. приказа от 12.12.2023 N 677н);
#   * осмотры — приложение N 1 к Порядку, утверждённому приказом Минздрава
#     России от 14.04.2025 N 211н;
#   * доза витамина D, еженедельное взвешивание и кормление по требованию —
#     Программа оптимизации вскармливания детей первого года жизни в
#     Российской Федерации (Союз педиатров России, 2019).
#
# Формулировки перенесены из таблиц дословно — восстановлена только буква «ё».
# Пометка «(группы риска)» сохранена: убрать её значит сказать семье, что
# прививка положена всем.
#
# ЧЕГО ЗДЕСЬ НЕТ И НЕ БУДЕТ:
#
#   * возрастов старше трёх лет. Приказы идут до 14 и 17 лет, но бот — про
#     первый год жизни, и полсотни строк про подростковую диспансеризацию
#     сделали бы файл нечитаемым ради того, чего здесь никто не увидит;
#   * календаря по эпидемическим показаниям (приложение N 2 к 1122н): он не
#     про возраст, а про обстоятельства — вспышку, укус, поездку;
#   * противопоказаний и того, что делать при пропуске. Это разговор с врачом,
#     а не строка расписания. Текст порядка проведения лежит в базе знаний, и
#     на вопрос о нём бот ответит цитатой из документа.
#
# Поля записи календаря:
#
#   age_months, age_days   возраст; складываются, и хотя бы одно обязано быть
#                          указано. Месяцы календарные: «3 месяца» от 30 ноября
#                          это 28 февраля, а не «плюс 90 суток». «4,5 месяца»
#                          записывается как 4 месяца и 15 дней — половины
#                          календарного месяца не бывает, и выбор сделан здесь
#   age_label              как возраст назван в приказе, дословно
#   in_hospital            делается в роддоме, до появления бота. Показываем,
#                          но напоминания не заводим: иначе первое, что сделает
#                          бот у семьи с двухмесячным ребёнком, — напомнит о
#                          том, что сделали два месяца назад
#   items/doctors/tests    что именно предстоит
#   note                   оговорка приказа, если она есть
#   source                 id из секции sources этого же файла
#
# Возраст здесь ПАСПОРТНЫЙ, а не скорректированный, даже у недоношенного.
# Это противоположно правилу для вех развития и центилей роста, и так и
# задумано: приказ 1122н привязывает прививки к возрасту от рождения, а
# недоношенность меняет в нём вид вакцины (п. 12 — инактивированная вместо
# живой), но не срок.

version: "2026-09-14"

sources:
  - id: order_1122n
    title: Национальный календарь профилактических прививок
    publisher: Приказ Минздрава России от 06.12.2021 № 1122н (ред. от 12.12.2023)
    year: 2023
    url: http://publication.pravo.gov.ru/document/0001202112200070

  - id: order_211n
    title: Порядок прохождения несовершеннолетними профилактических медицинских осмотров
    publisher: Приказ Минздрава России от 14.04.2025 № 211н
    year: 2025
    url: http://publication.pravo.gov.ru/document/0001202505230032

  - id: feeding_2019
    title: Программа оптимизации вскармливания детей первого года жизни в Российской Федерации
    publisher: Союз педиатров России, ФГАУ «НМИЦ здоровья детей»
    year: 2019
    url: https://nczd.ru/programma-optimizacii-vskarmlivanija-detej-pervogo-goda-zhizni-v-rossijskoj-federacii/

# Пресеты — то, что можно включить тапом в /remind.
#
#   every: hourly   — каждые N часов от момента включения; N выбирает человек
#          daily    — каждый день в локальное время at
#          weekly   — раз в неделю в тот же день недели, в локальное время at
#          calendar — по календарю ниже; section говорит, по какому
#
# Как «каждые три часа» превращается в правило RFC 5545 — дело кода:
# FREQ=HOURLY;INTERVAL=3 не читается человеком, ради которого этот файл и
# заведён.
presets:
  - id: feed
    icon: 🍼
    title: Кормление
    text: >-
      Пора кормить. Напоминание — для тех, кто держит ритм; здоровому
      ребёнку рекомендовано свободное вскармливание по требованию, и
      пропущенный интервал сам по себе ничего не значит.
    every: hourly
    choices: [2, 3, 4]
    default_hours: 3
    source: feeding_2019

  - id: vitd
    icon: 💊
    title: Витамин D
    text: >-
      Витамин D — 1000 МЕ в сутки, круглый год, включая лето. Дозу назначает
      педиатр: после полугода и на Европейском Севере России она выше, а
      родившимся раньше срока её подбирают отдельно.
    every: daily
    at: "10:00"
    source: feeding_2019

  - id: weigh
    icon: ⚖️
    title: Взвешивание
    text: >-
      Пора взвесить — без одежды и подгузника, в одно и то же время.
      Взвешивания здорового ребёнка целесообразно проводить раз в неделю:
      чаще — это шум, а не динамика.
    every: weekly
    at: "10:00"
    source: feeding_2019

  - id: vaccine
    icon: 💉
    title: Прививки
    every: calendar
    section: vaccines
    source: order_1122n

  - id: checkup
    icon: 🩺
    title: Осмотры
    every: calendar
    section: checkups
    source: order_211n

# Национальный календарь профилактических прививок, приложение N 1 к приказу
# 1122н. Строки 1-11 таблицы: от рождения до 20 месяцев. Дальше по приказу
# идут 6 лет, 6-7 лет и 14 лет — они за горизонтом этого файла.
vaccines:
  remind_before_days: 3
  at: "10:00"
  entries:
    - age_days: 0
      age_label: первые 24 часа жизни
      in_hospital: true
      items:
        - Первая вакцинация против вирусного гепатита B
      source: order_1122n

    - age_days: 3
      age_label: 3–7 день жизни
      in_hospital: true
      items:
        - Вакцинация против туберкулёза
      note: >-
        Проводится вакциной для щадящей первичной вакцинации (БЦЖ-М).
        Если в роддоме не привили, сделать можно до семи лет.
      source: order_1122n

    - age_months: 1
      age_label: 1 месяц
      items:
        - Вторая вакцинация против вирусного гепатита B
      source: order_1122n

    - age_months: 2
      age_label: 2 месяца
      items:
        - Третья вакцинация против вирусного гепатита B (группы риска)
        - Первая вакцинация против пневмококковой инфекции
      source: order_1122n

    - age_months: 3
      age_label: 3 месяца
      items:
        - Первая вакцинация против дифтерии, коклюша, столбняка
        - Первая вакцинация против полиомиелита
        - Первая вакцинация против гемофильной инфекции типа b
      source: order_1122n

    # Единственная запись, где возраст задан обоими полями. Календарного
    # «полумесяца» не существует, и решение «половина — это 15 дней» стоит
    # здесь, в данных, а не в коде
    - age_months: 4
      age_days: 15
      age_label: 4,5 месяца
      items:
        - Вторая вакцинация против дифтерии, коклюша, столбняка
        - Вторая вакцинация против гемофильной инфекции типа b
        - Вторая вакцинация против полиомиелита
        - Вторая вакцинация против пневмококковой инфекции
      source: order_1122n

    - age_months: 6
      age_label: 6 месяцев
      items:
        - Третья вакцинация против дифтерии, коклюша, столбняка
        - Третья вакцинация против вирусного гепатита B
        - Третья вакцинация против полиомиелита
        - Третья вакцинация против гемофильной инфекции типа b
      source: order_1122n

    - age_months: 12
      age_label: 12 месяцев
      items:
        - Вакцинация против кори, краснухи, эпидемического паротита
        - Четвёртая вакцинация против вирусного гепатита B (группы риска)
      source: order_1122n

    - age_months: 15
      age_label: 15 месяцев
      items:
        - Ревакцинация против пневмококковой инфекции
      source: order_1122n

    - age_months: 18
      age_label: 18 месяцев
      items:
        - Первая ревакцинация против дифтерии, коклюша, столбняка
        - Первая ревакцинация против полиомиелита
        - Ревакцинация против гемофильной инфекции типа b
      source: order_1122n

    - age_months: 20
      age_label: 20 месяцев
      items:
        - Вторая ревакцинация против полиомиелита
      source: order_1122n

# Профилактические медицинские осмотры, приложение N 1 к Порядку из приказа
# 211н. Строки 1-17 таблицы: от периода новорождённости до трёх лет. Дальше
# по приказу идут возрасты с 4 до 17 лет — они за горизонтом этого файла.
#
# «Врач-педиатр» в приказе означает в том числе участкового педиатра и врача
# общей практики; отдельной строкой это не пишем, чтобы не удваивать каждый
# возраст.
checkups:
  remind_before_days: 3
  at: "10:00"
  entries:
    - age_days: 0
      age_label: период новорождённости
      in_hospital: true
      doctors:
        - Врач-педиатр
      tests:
        - Неонатальный скрининг на врождённые и (или) наследственные заболевания
        - Расширенный неонатальный скрининг на врождённые и (или) наследственные заболевания
        - Аудиологический скрининг
      note: >-
        Оба скрининга — не позднее 28 дней жизни, аудиологический может быть
        проведён в течение первого года, если в роддоме его не сделали.
      source: order_211n

    - age_months: 1
      age_label: 1 месяц
      doctors:
        - Врач-педиатр
        - Врач-детский хирург
        - Врач-офтальмолог
      tests:
        - Ультразвуковое исследование органов брюшной полости (комплексное)
        - Ультразвуковое исследование почек
        - Ультразвуковое исследование тазобедренного сустава с двух сторон
        - Эхокардиография
        - Нейросонография
        - Офтальмоскопия в условиях мидриаза
      source: order_211n

    - age_months: 2
      age_label: 2 месяца
      doctors: [Врач-педиатр]
      source: order_211n

    - age_months: 3
      age_label: 3 месяца
      doctors:
        - Врач-педиатр
        - Врач-невролог
        - Врач-травматолог-ортопед
      tests:
        - Общий (клинический) анализ крови
        - Общий (клинический) анализ мочи
      source: order_211n

    - age_months: 4
      age_label: 4 месяца
      doctors: [Врач-педиатр]
      source: order_211n

    - age_months: 5
      age_label: 5 месяцев
      doctors: [Врач-педиатр]
      source: order_211n

    - age_months: 6
      age_label: 6 месяцев
      doctors: [Врач-педиатр]
      source: order_211n

    - age_months: 7
      age_label: 7 месяцев
      doctors: [Врач-педиатр]
      source: order_211n

    - age_months: 8
      age_label: 8 месяцев
      doctors: [Врач-педиатр]
      source: order_211n

    - age_months: 9
      age_label: 9 месяцев
      doctors: [Врач-педиатр]
      source: order_211n

    - age_months: 10
      age_label: 10 месяцев
      doctors: [Врач-педиатр]
      source: order_211n

    - age_months: 11
      age_label: 11 месяцев
      doctors: [Врач-педиатр]
      source: order_211n

    - age_months: 12
      age_label: 12 месяцев
      doctors:
        - Врач-педиатр
        - Врач-невролог
        - Врач-детский хирург
        - Врач-офтальмолог
        - Врач-оториноларинголог
        - Врач-стоматолог детский
      tests:
        - Общий (клинический) анализ крови
        - Общий (клинический) анализ мочи
        - Офтальмоскопия в условиях мидриаза
        - Исследование вызванной отоакустической эмиссии
        - Электрокардиография
      source: order_211n

    - age_months: 15
      age_label: 1 год 3 месяца
      doctors: [Врач-педиатр]
      source: order_211n

    - age_months: 18
      age_label: 1 год 6 месяцев
      doctors:
        - Врач-педиатр
        - Врач-невролог
      tests:
        - Скрининг на выявление группы риска возникновения или наличия нарушений психического развития
      note: >-
        Невролог — для детей из группы риска возникновения или наличия
        нарушений психического развития по результату скрининга. Сам скрининг
        педиатр проводит анкетированием родителей.
      source: order_211n

    - age_months: 24
      age_label: 2 года
      doctors:
        - Врач-педиатр
        - Врач-стоматолог детский
        - Врач-психиатр детский
      note: >-
        Детский психиатр — для детей из группы риска возникновения или наличия
        нарушений психического развития по результату скрининга.
      source: order_211n

    - age_months: 36
      age_label: 3 года
      doctors:
        - Врач-педиатр
        - Врач-невролог
        - Врач-детский хирург
        - Врач-офтальмолог
        - Врач-стоматолог детский
        - Врач-оториноларинголог
      tests:
        - Общий (клинический) анализ крови
        - Общий (клинический) анализ мочи
      source: order_211n
